<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Blue Sensi Pro Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: radial-gradient(circle at 50% 0%, #001f3f 0%, #020813 70%, #000206 100%);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        /* --- ENCABEZADO BLUE STYLE --- */
        .header-main {
            margin: 20px auto 30px auto;
            max-width: 480px;
        }
        .badge-blue {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 54px;
            background: linear-gradient(135deg, #00f0ff 0%, #0072ff 50%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.6));
            letter-spacing: -1px;
        }
        .title-sub {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }
        
        /* Indicador de Estado Inyectable */
        .status-bar {
            display: inline-block;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00f0ff;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #00f0ff;
            border-radius: 50%;
            margin-right: 6px;
            animation: parpadeo 1.2s infinite;
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
        }

        /* ==========================================
           PANEL DE SELECCIÓN DIRECTA
        ========================================== */
        #pantalla-sensi {
            max-width: 460px;
            margin: 0 auto;
        }
        .panel-container {
            background: linear-gradient(135deg, rgba(2, 15, 38, 0.85) 0%, rgba(1, 5, 15, 0.98) 100%);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        }
        .opcion-grupo {
            text-align: left;
            margin-bottom: 22px;
        }
        label {
            display: block;
            color: #00f0ff;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-align: center;
        }

        .modos-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-modo {
            background: #020a17;
            border: 1px solid #0a254d;
            color: #8faed9;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-modo.active {
            background: linear-gradient(135deg, #0072ff 0%, #00f0ff 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
            transform: translateY(-1px);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #0072ff, #00f0ff);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 5px 20px rgba(0, 114, 255, 0.4);
            margin-top: 5px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* ==========================================
           MODAL DE RESULTADOS HOLOGRÁFICOS BLUE
        ========================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 3, 8, 0.94);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: #020712;
            border: 1px solid #0a2b5c;
            border-radius: 28px;
            width: 100%;
            max-width: 410px;
            padding: 22px 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .card-sens {
            background: #030d1f;
            border: 1px solid #0b2244;
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
        }
        .card-label {
            color: #8faed9;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
        }
        .card-value {
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 19px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        /* --- SECCIÓN DE AJUSTES RECOMENDADOS --- */
        .seccion-ajustes {
            background: rgba(0, 114, 255, 0.05);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 12px;
            margin-top: 15px;
            text-align: left;
        }
        .ajustes-titulo {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #ffaa00;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 170, 0, 0.2);
            padding-bottom: 4px;
        }
        .ajuste-item {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        .ajuste-item span {
            color: #00f0ff;
        }

        .btn-close {
            width: 100%;
            background: #020b1c;
            color: #ffffff;
            border: 1px solid #092c61;
            padding: 13px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- LOGOTIPO Y BARRA DE ESTADO -->
    <div class="header-main">
        <div class="badge-blue">BLUE SENSI</div>
        <div class="title-sub">Configuración Premium</div>
        <div class="status-bar"><span class="dot"></span>Algoritmo Inyectado</div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="pantalla-sensi">
        <div class="panel-container">
            <div class="opcion-grupo">
                <label>Selecciona tu algoritmo de disparo:</label>
                <div class="modos-stack">
                    <button id="btn-alta" class="btn-modo active" onclick="cambiarModo('alta')">⚡ Alta Sensibilidad (Full Rojo)</button>
                    <button id="btn-baja" class="btn-modo" onclick="cambiarModo('baja')">📉 Sensibilidad Baja (Más Estable)</button>
                </div>
            </div>
            <button class="btn-action" onclick="generarConfig()">Calcular Sensi</button>
        </div>
    </div>

    <!-- MODAL FINAL CON SENSI Y AJUSTES EXTRA -->
    <div id="resultadoModal" class="modal">
        <div class="modal-content">
            <div style="font-family:'Orbitron', sans-serif; font-size:15px; font-weight:700; border-bottom:2px solid #00f0ff; padding-bottom:8px; margin-bottom:12px; color:#00f0ff;" id="txtModoTitulo">REGISTRO BLUE</div>
            
            <!-- Bloque de Sensibilidades -->
            <div class="grid-cards">
                <div class="card-sens"><span class="card-label">General</span><span id="vGen" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira 1X</span><span id="vMira1" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira X2</span><span id="vMira2" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira X4</span><span id="vMira4" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Franco</span><span id="vFranco" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Cámara</span><span id="vCamara" class="card-value">0%</span></div>
            </div>

            <!-- Bloque Dinámico de Ajustes del Teléfono/Juego -->
            <div class="seccion-ajustes">
                <div class="ajustes-titulo">🛠️ Ajustes Internos Recomendados</div>
                <div class="ajuste-item">Botón de Disparo: <span id="vBoton">0%</span></div>
                <div class="ajuste-item">DPI del Sistema: <span id="vDpi">0</span></div>
                <div class="ajuste-item">Velocidad de Puntero: <span id="vPuntero">Máxima</span></div>
                <div class="ajuste-item">Supresor (Accesibilidad): <span id="vSupresor">Desactivado</span></div>
            </div>

            <button class="btn-close" onclick="cerrarModal()">Aplicar en el Juego</button>
        </div>
    </div>

    <script src="sens.js"></script>
</body>
</html>
