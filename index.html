<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador de Sensibilidad - Free Fire</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff4655;
            --text-color: #ffffff;
            --subtext: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            font-size: 14px;
            color: var(--subtext);
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #2a2a32;
            color: var(--text-color);
            border: 1px solid #3a3a46;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        .results {
            background: #18181c;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a32;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label-name {
            font-weight: 500;
        }

        .value {
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn-copy {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #e03e4d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sensibilidad FF</h2>

    <label for="device">Selecciona tu gama o dispositivo:</label>
    <select id="device" onchange="actualizarSensibilidad()">
        <option value="baja">Gama Baja (2GB - 3GB RAM)</option>
        <option value="media">Gama Media (4GB - 6GB RAM)</option>
        <option value="alta">Gama Alta / iPhone (8GB+ RAM)</option>
    </select>

    <div class="results">
        <div class="row">
            <span class="label-name">General:</span>
            <span class="value" id="general">100</span>
        </div>
        <div class="row">
            <span class="label-name">Punto Rojo:</span>
            <span class="value" id="reddot">98</span>
        </div>
        <div class="row">
            <span class="label-name">Mira 2x:</span>
            <span class="value" id="scope2x">95</span>
        </div>
        <div class="row">
            <span class="label-name">Mira 4x:</span>
            <span class="value" id="scope4x">90</span>
        </div>
        <div class="row">
            <span class="label-name">Francotirador:</span>
            <span class="value" id="sniper">50</span>
        </div>
        <div class="row">
            <span class="label-name">Cámara 360:</span>
            <span class="value" id="freelook">65</span>
        </div>
    </div>

    <button class="btn-copy" onclick="copiarConfiguracion()">Copiar Configuración</button>
</div>

<!-- Enlace al archivo JavaScript externo -->
<script src="sens.js"></script>

</body>
</html>
