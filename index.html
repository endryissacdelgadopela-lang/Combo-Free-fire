<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador Sensibilidad Free Fire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff0000',
                        dark: '#0f0f0f',
                        card: '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .input-range {
                -webkit-appearance: none;
                height: 8px;
                border-radius: 4px;
                background: #333;
                outline: none;
            }
            .input-range::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #ff0000;
                cursor: pointer;
                box-shadow: 0 0 10px #ff0000;
            }
            .input-range::-moz-range-thumb {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #ff0000;
                cursor: pointer;
                box-shadow: 0 0 10px #ff0000;
            }
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen pb-20">
    <!-- Crédito Permanente -->
    <div class="w-full bg-gradient-to-r from-red-700 to-red-500 py-2 text-center font-bold text-sm sticky top-0 z-50 shadow-lg">
        Freestyle Credit: Endry + Dola 🎮
    </div>

    <div class="container mx-auto px-4 py-6 max-w-2xl">
        <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-black text-center mb-8 bg-gradient-to-r from-red-400 to-red-600 bg-clip-text text-transparent">
            Configurador FF
        </h1>

        <!-- Pestañas -->
        <div class="flex gap-2 mb-6 bg-card p-2 rounded-xl">
            <button id="tabSensi" class="flex-1 py-3 rounded-lg font-bold bg-primary shadow-lg shadow-red-600/30 transition-all">
                <i class="fa-solid fa-crosshairs mr-2"></i>SENSIBILIDAD
            </button>
            <button id="tabProxy" class="flex-1 py-3 rounded-lg font-bold transition-all hover:bg-red-900/30">
                <i class="fa-solid fa-gear mr-2"></i>FF PROXY
            </button>
        </div>

        <!-- SECCIÓN SENSIBILIDAD -->
        <div id="seccionSensi" class="space-y-6">
            <!-- Selección Dispositivo -->
            <div class="bg-card p-5 rounded-xl shadow">
                <label class="block font-bold mb-3 text-lg">Elige tu dispositivo</label>
                <select id="dispositivo" class="w-full bg-dark border border-gray-700 rounded-lg p-3 focus:border-primary outline-none">
                    <option value="iphone">iPhone / iPad</option>
                    <option value="android">Android Gama Alta</option>
                    <option value="samsung">Samsung</option>
                    <option value="xiaomi">Xiaomi / Redmi</option>
                </select>
            </div>

            <!-- DPI y Botón Disparo -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-card p-4 rounded-xl">
                    <label class="block font-bold mb-2">Usar DPI</label>
                    <div class="flex gap-2">
                        <button id="dpiSi" class="flex-1 py-2 rounded-lg bg-primary font-bold">SI</button>
                        <button id="dpiNo" class="flex-1 py-2 rounded-lg bg-gray-700 font-bold">NO</button>
                    </div>
                    <input type="number" id="valorDpi" class="w-full mt-3 bg-dark border border-gray-700 rounded-lg p-2 focus:border-primary outline-none" placeholder="Valor DPI" min="200" max="1200">
                </div>
                <div class="bg-card p-4 rounded-xl">
                    <label class="block font-bold mb-2">Botón de disparo</label>
                    <div class="flex gap-2">
                        <button id="botonSi" class="flex-1 py-2 rounded-lg bg-primary font-bold">SI</button>
                        <button id="botonNo" class="flex-1 py-2 rounded-lg bg-gray-700 font-bold">NO</button>
                    </div>
                    <input type="number" id="tamBoton" class="w-full mt-3 bg-dark border border-gray-700 rounded-lg p-2 focus:border-primary outline-none" placeholder="Tamaño %" min="20" max="100">
                </div>
            </div>

            <!-- Sensibilidades TODO ROJO -->
            <div class="bg-card p-5 rounded-xl shadow space-y-5">
                <h3 class="text-xl font-bold text-primary">Sensibilidad Todo Rojo</h3>
                
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="font-semibold">Mira de Punto Rojo</label>
                            <span id="puntRojoValor" class="font-bold text-primary">100</span>
                        </div>
                        <input type="range" id="puntRojo" min="0" max="100" value="100" class="input-range w-full">
                    </div>

                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="font-semibold">Mira x2</label>
                            <span id="mira2Valor" class="font-bold text-primary">98</span>
                        </div>
                        <input type="range" id="mira2" min="0" max="100" value="98" class="input-range w-full">
                    </div>

                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="font-semibold">Mira x4</label>
                            <span id="mira4Valor" class="font-bold text-primary">95</span>
                        </div>
                        <input type="range" id="mira4" min="0" max="100" value="95" class="input-range w-full">
                    </div>

                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="font-semibold">Mira Francotirador</label>
                            <span id="francoValor" class="font-bold text-primary">90</span>
                        </div>
                        <input type="range" id="franco" min="0" max="100" value="90" class="input-range w-full">
                    </div>

                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="font-semibold">Cámara 360</label>
                            <span id="camaraValor" class="font-bold text-primary">100</span>
                        </div>
                        <input type="range" id="camara" min="0" max="100" value="100" class="input-range w-full">
                    </div>
                </div>
            </div>

            <!-- Botones Acción -->
            <div class="grid grid-cols-2 gap-4">
                <button id="btnCargar" class="py-4 bg-gradient-to-r from-red-600 to-red-500 rounded-xl font-bold text-lg shadow-lg hover:shadow-red-600/40 transition-all">
                    <i class="fa-solid fa-download mr-2"></i>CARGAR TODO ROJO
                </button>
                <button id="btnCopiar" class="py-4 bg-gradient-to-r from-red-800 to-red-700 rounded-xl font-bold text-lg shadow-lg hover:shadow-red-700/40 transition-all">
                    <i class="fa-solid fa-copy mr-2"></i>COPIAR AJUSTES
                </button>
            </div>
        </div>

        <!-- SECCIÓN FF PROXY -->
        <div id="seccionProxy" class="space-y-6 hidden">
            <div class="bg-card p-5 rounded-xl shadow">
                <h3 class="text-xl font-bold mb-4 text-primary">Estabiliza Free Fire</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block font-bold mb-2">Abrir versión:</label>
                        <select id="versionFF" class="w-full bg-dark border border-gray-700 rounded-lg p-3 focus:border-primary outline-none">
                            <option value="max">Free Fire MAX</option>
                            <option value="normal">Free Fire Normal</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between p-3 bg-dark rounded-lg">
                        <label class="font-semibold">Quitar llamadas y notificaciones</label>
                        <button id="opcion1" class="w-12 h-6 bg-gray-700 rounded-full relative transition-all">
                            <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all"></span>
                        </button>
                    </div>

                    <div class="flex items-center justify-between p-3 bg-dark rounded-lg">
                        <label class="font-semibold">Aceleración GPU</label>
                        <button id="opcion2" class="w-12 h-6 bg-gray-700 rounded-full relative transition-all">
                            <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all"></span>
                        </button>
                    </div>

                    <div class="flex items-center justify-between p-3 bg-dark rounded-lg">
                        <label class="font-semibold">Modo Alto Rendimiento</label>
                        <button id="opcion3" class="w-12 h-6 bg-gray-700 rounded-full relative transition-all">
                            <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all"></span>
                        </button>
                    </div>
                </div>
            </div>

            <button class="w-full py-4 bg-gradient-to-r from-red-600 to-red-500 rounded-xl font-bold text-lg shadow-lg">
                <i class="fa-solid fa-bolt mr-2"></i>APLICAR Y ABRIR FF
            </button>
        </div>
    </div>

    <script src="sens.js"></script>
</body>
</html>
