<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ BLUE LOCK: Egoist Sensi</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            /* Fondo inspirado en el campo de fútbol futurista de Blue Lock */
            background: radial-gradient(circle at 50% 30%, #001133 0%, #020a17 60%, #000105 100%);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- ENCABEZADO BLUE LOCK --- */
        .header-main {
            margin: 20px auto 25px auto;
            max-width: 480px;
            position: relative;
        }
        
        /* Efecto de Cadenas / Hexágonos de Blue Lock en el título */
        .badge-blue {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 46px;
            background: linear-gradient(135deg, #00f0ff 0%, #0055ff 50%, #00aaff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.5));
            letter-spacing: 1px;
        }
        .title-sub {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 5px;
            color: #8faed9;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }
        
        .status-bar {
            display: inline-block;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid #00f0ff;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f0ff;
            margin-top: 12px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
            margin-right: 6px;
            animation: parpadeo 1.2s infinite;
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
        }

        /* ==========================================
           PANEL PRINCIPAL DE SELECCIÓN
        ========================================== */
        #pantalla-sensi {
            max-width: 460px;
            margin: 0 auto;
        }
        .panel-container {
            background: linear-gradient(135deg, rgba(2, 10, 28, 0.9) 0%, rgba(1, 4, 12, 0.98) 100%);
            border: 2px solid #0044cc;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            position: relative;
        }
        
        /* Decoración de hexágono de fútbol de fondo */
        .panel-container::before {
            content: "⚽";
            position: absolute;
            font-size: 120px;
            opacity: 0.03;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .opcion-grupo {
            text-align: left;
            margin-bottom: 22px;
        }
        label {
            display: block;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .modos-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-modo {
            background: rgba(3, 15, 38, 0.6);
            border: 1px solid #0033aa;
            color: #8faed9;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            transition: all 0.25s ease;
            position: relative;
        }
        .btn-modo.active {
            background: linear-gradient(135deg, #0044ff 0%, #00d2ff 100%);
            color: #ffffff;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.5);
            transform: translateY(-1px);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #0044ff, #00f0ff);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            margin-top: 5px;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* ==========================================
           SECCIÓN DE CRÉDITOS FIJOS EN PANTALLA
        ========================================== */
        .creditos-box {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            max-width: 460px;
            margin-left: auto;
            margin-right: auto;
        }
        .creditos-box p {
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
            color: #a0b0c5;
        }
        .creditos-box strong {
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        /* ==========================================
           MODAL DE RESULTADOS HOLOGRÁFICOS
        ========================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 12, 0.96);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: #020714;
            border: 2px solid #0055ff;
            border-radius: 16px;
            width: 100%;
            max-width: 410px;
            padding: 22px 18px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .card-sens {
            background: rgba(3, 15, 38, 0.8);
            border: 1px solid #0033aa;
            border-radius: 8px;
            padding: 12px 6px;
            text-align: center;
        }
        .card-label {
            color: #8faed9;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        .card-value {
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 21px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .seccion-ajustes {
            background: rgba(0, 68, 255, 0.08);
            border: 1px dashed #00f0ff;
            border-radius: 10px;
            padding: 14px;
            margin-top: 15px;
            text-align: left;
        }
        .ajustes-titulo {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #ffb700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 183, 0, 0.2);
            padding-bottom: 4px;
        }
        .ajuste-item {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }
        .ajuste-item span {
            color: #00f0ff;
            font-weight: 700;
        }

        .btn-close {
            width: 100%;
            background: linear-gradient(180deg, #041635 0%, #020a17 100%);
            color: #ffffff;
            border: 1px solid #0055ff;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .btn-close:hover {
            background: #002288;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO PRO BLUE LOCK -->
    <div class="header-main">
        <div class="badge-blue">BLUE LOCK</div>
        <div class="title-sub">Egoist Sensibility</div>
        <div class="status-bar"><span class="dot"></span>Flujo del Ego Activado</div>
    </div>

    <!-- PANEL DE SELECCIÓN DE DOS BOTONES -->
    <div id="pantalla-sensi">
        <div class="panel-container">
            <div class="opcion-grupo">
                <label>Selecciona tu estilo de juego en el campo:</label>
                <div class="modos-stack">
                    <button id="btn-alta" class="btn-modo active" onclick="cambiarModo('alta')">⚽ Delantero: Alta Sensi (Full Rojo)</button>
                    <button id="btn-baja" class="btn-modo" onclick="cambiarModo('baja')">🛡️ Defensa: Sensi Baja (Más Control)</button>
                </div>
            </div>
            <button class="btn-action" onclick="generarConfig()">Despertar Instinto</button>
        </div>

        <!-- TUS CRÉDITOS OFICIALES VISIBLES SIEMPRE ABAJO -->
        <div class="creditos-box">
            <p>Crédito de IA & Desarrollado por: <strong>Endry</strong></p>
        </div>
    </div>

    <!-- MODAL FINAL CON RECOMENDACIONES -->
    <div id="resultadoModal" class="modal">
        <div class="modal-content">
            <div style="font-family:'Orbitron', sans-serif; font-size:15px; font-weight:700; border-bottom:2px solid #00f0ff; padding-bottom:8px; margin-bottom:12px; color:#00f0ff;" id="txtModoTitulo">REGISTRO BLUE LOCK</div>
            
            <!-- Cuadrícula de Sensi -->
            <div class="grid-cards">
                <div class="card-sens"><span class="card-label">General</span><span id="vGen" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira 1X</span><span id="vMira1" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira X2</span><span id="vMira2" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira X4</span><span id="vMira4" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Franco</span><span id="vFranco" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Cámara</span><span id="vCamara" class="card-value">0%</span></div>
            </div>

            <!-- Ajustes Internos Recomendados -->
            <div class="seccion-ajustes">
                <div class="ajustes-titulo">🛠️ Ajustes de Arma del Egoísta</div>
                <div class="ajuste-item">Botón de Disparo: <span id="vBoton">0%</span></div>
                <div class="ajuste-item">DPI Recomendado: <span id="vDpi">0</span></div>
                <div class="ajuste-item">Velocidad de Puntero: <span id="vPuntero">Máxima</span></div>
                <div class="ajuste-item">Supresor: <span id="vSupresor">Desactivado</span></div>
            </div>

            <button class="btn-close" onclick="cerrarModal()">Dominar la Partida</button>
        </div>
    </div>

    <!-- Script blindado contra caché -->
    <script src="sens.js?v=3"></script>
</body>
</html>
