<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Sensibilidad Free Fire</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;min-height:100vh;padding:20px}
        .container{max-width:460px;margin:0 auto;background:rgba(30,41,59,.8);padding:25px;border-radius:20px;box-shadow:0 0 30px rgba(59,130,246,.25);border:1px solid rgba(96,165,250,.3)}
        h1{text-align:center;color:#60a5fa;margin-bottom:25px;font-size:22px}
        .bloque{margin-bottom:20px}
        label{display:block;margin-bottom:8px;color:#bfdbfe;font-weight:500}
        select,input{width:100%;padding:12px;border-radius:10px;border:none;background:#1e293b;color:#fff;font-size:15px;border:1px solid #334155}
        .fila-opciones{display:flex;gap:10px}
        .opcion{flex:1;padding:12px;text-align:center;border-radius:10px;background:#1e293b;cursor:pointer;transition:.2s;border:1px solid #334155}
        .opcion.activo{background:#3b82f6;border-color:#60a5fa;font-weight:bold;color:#fff}
        #campoDPI{display:block}
        button{width:100%;padding:14px;background:linear-gradient(90deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:5px;box-shadow:0 4px 12px rgba(59,130,246,.3)}
        button:hover{transform:translateY(-1px)}
        .resultado{margin-top:25px;padding:20px;background:rgba(37,99,235,.1);border-radius:14px;border-left:4px solid #60a5fa}
        .resultado h3{color:#93c5fd;margin-bottom:12px}
        .item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.2)}
        .item:last-child{border:none}
        .valor{font-weight:bold;color:#86efac}
        .oculto{display:none !important}
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 Sensibilidad Free Fire</h1>

    <div class="bloque">
        <label>📱 Tu dispositivo</label>
        <select id="dispositivo">
            <option value="iphone">iPhone</option>
            <option value="samsung">Samsung</option>
            <option value="xiaomi">Xiaomi / Redmi</option>
            <option value="motorola">Motorola</option>
            <option value="huawei">Huawei</option>
            <option value="oppo">Oppo</option>
            <option value="vivo">Vivo</option>
        </select>
    </div>

    <div class="bloque">
        <label>🔧 ¿Usas DPI personalizado?</label>
        <div class="fila-opciones">
            <div class="opcion activo" id="dpiSi" onclick="selDPI('si')">✅ Con DPI</div>
            <div class="opcion" id="dpiNo" onclick="selDPI('no')">❌ Sin DPI</div>
        </div>
    </div>

    <div class="bloque" id="campoDPI">
        <label>Valor de DPI</label>
        <input type="number" id="valorDPI" value="480" placeholder="Ej: 480, 550, 600">
    </div>

    <div class="bloque">
        <label>🔥 Botón de disparo</label>
        <div class="fila-opciones">
            <div class="opcion activo" id="botonSi" onclick="selBoton('si')">✅ Grande</div>
            <div class="opcion" id="botonNo" onclick="selBoton('no')">❌ Pequeño</div>
        </div>
    </div>

    <button onclick="calcular()">⚙️ Generar Sensibilidad</button>

    <div class="resultado">
        <h3>📋 Configuración Recomendada</h3>
        <div class="item"><span>🎯 General</span><span class="valor" id="vGeneral">—</span></div>
        <div class="item"><span>🔴 Mira de Punto Rojo</span><span class="valor" id="vRojo">—</span></div>
        <div class="item"><span>🔭 Mira x2</span><span class="valor" id="vX2">—</span></div>
        <div class="item"><span>🎯 Mira x4</span><span class="valor" id="vX4">—</span></div>
        <div class="item"><span>💥 Francotirador</span><span class="valor" id="vFran">—</span></div>
        <div class="item"><span>🔄 Cámara 360</span><span class="valor" id="vCam">—</span></div>
    </div>
</div>
<script src="sens.js"></script>
</body>
</html>
