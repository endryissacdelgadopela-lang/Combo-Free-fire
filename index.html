<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE SENSI - PERFIL Y MONEDAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: radial-gradient(circle at 50% 30%, #001f4d 0%, #020a1c 60%, #000000 100%);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        .header-main {
            margin: 15px auto 20px auto;
            max-width: 480px;
        }
        
        .badge-blue {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            background: linear-gradient(135deg, #00f0ff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 1px;
        }

        /* BARRA DE PERFIL Y MONEDAS */
        .user-bar {
            background: rgba(2, 12, 36, 0.9);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 10px 15px;
            max-width: 460px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            font-weight: 700;
            color: #00f0ff;
            font-size: 14px;
        }
        .coins-info {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #ffcc00;
            font-size: 15px;
        }
        .btn-reg {
            background: #0055ff;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        #pantalla-sensi {
            max-width: 460px;
            margin: 0 auto;
        }
        .panel-container {
            background: linear-gradient(135deg, rgba(2, 12, 36, 0.9) 0%, rgba(1, 4, 15, 0.98) 100%);
            border: 2px solid #0055ff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        }

        .modos-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-modo {
            background: rgba(3, 16, 41, 0.6);
            border: 1px solid #003cdb;
            color: #8faed9;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
        }
        .btn-modo.active {
            background: linear-gradient(135deg, #0055ff 0%, #00f0ff 100%);
            color: #ffffff;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #0055ff, #00f0ff);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            margin-top: 15px;
        }

        .creditos-box {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 12px;
            border-radius: 8px;
            max-width: 460px;
            margin-left: auto;
            margin-right: auto;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 14, 0.96);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: #020716;
            border: 2px solid #00f0ff;
            border-radius: 12px;
            width: 100%;
            max-width: 410px;
            padding: 22px 18px;
        }

        .input-reg {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #00112c;
            border: 1px solid #00f0ff;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .card-sens {
            background: rgba(3, 16, 41, 0.8);
            border: 1px solid #003cdb;
            border-radius: 6px;
            padding: 10px 6px;
        }
        .card-value {
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 20px;
        }

        .btn-close {
            width: 100%;
            background: #0055ff;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header-main">
        <div class="badge-blue">PANEL SENSI PRO</div>
    </div>

    <!-- BARRA DE PERFIL Y MONEDAS -->
    <div class="user-bar">
        <div class="user-info" id="txtUsuario">👤 Invitado</div>
        <div class="coins-info" id="txtMonedas">🪙 0 Monedas</div>
        <button class="btn-reg" id="btnAbrirReg" onclick="abrirRegistro()">Registrarse</button>
    </div>

    <div id="pantalla-sensi">
        <div class="panel-container">
            <div class="modos-stack">
                <button id="btn-alta" class="btn-modo active" onclick="cambiarModo('alta')">⚡ Sensibilidad Alta</button>
                <button id="btn-baja" class="btn-modo" onclick="cambiarModo('baja')">🛡️ Sensibilidad Baja</button>
                <button id="btn-pro" class="btn-modo" onclick="cambiarModo('pro')">🎯 Sensibilidad Profesional</button>
            </div>
            <button class="btn-action" onclick="generarConfig()">Cargar Configuración</button>
        </div>

        <div class="creditos-box">
            <p>Desarrollado por: <strong style="color:#00f0ff;">Endry</strong></p>
        </div>
    </div>

    <!-- MODAL DE REGISTRO -->
    <div id="registroModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#00f0ff; margin-top:0;">CREAR CUENTA</h3>
            <p style="font-size:13px; color:#aaa;">Regístrate para recibir tu bono semanal de monedas.</p>
            <input type="text" id="regNombre" class="input-reg" placeholder="Tu Nombre o Nombre de Usuario">
            <button class="btn-action" onclick="confirmarRegistro()">Registrarse & Ganar Monedas</button>
            <button class="btn-close" style="background:#333;" onclick="cerrarRegistro()">Cancelar</button>
        </div>
    </div>

    <!-- MODAL DE RESULTADOS -->
    <div id="resultadoModal" class="modal">
        <div class="modal-content">
            <div style="font-family:'Orbitron', sans-serif; font-size:14px; font-weight:700; color:#00f0ff;" id="txtModoTitulo">CONFIGURACIÓN</div>
            
            <div class="grid-cards">
                <div class="card-sens"><span style="display:block; font-size:11px;">General</span><span id="vGen" class="card-value">0%</span></div>
                <div class="card-sens"><span style="display:block; font-size:11px;">Punto Rojo</span><span id="vMira1" class="card-value">0%</span></div>
                <div class="card-sens"><span style="display:block; font-size:11px;">Mira X2</span><span id="vMira2" class="card-value">0%</span></div>
                <div class="card-sens"><span style="display:block; font-size:11px;">Mira X4</span><span id="vMira4" class="card-value">0%</span></div>
            </div>

            <div style="text-align:left; background:rgba(0,240,255,0.05); padding:10px; border-radius:6px; font-size:13px;">
                <div>Botón de Disparo: <span id="vBoton" style="color:#00f0ff; font-weight:700;">0%</span></div>
                <div>DPI Recomendado: <span id="vDpi" style="color:#00f0ff; font-weight:700;">0</span></div>
            </div>

            <button class="btn-close" onclick="cerrarModal()">Guardar Configuración</button>
        </div>
    </div>

    <script src="sens.js?v=10"></script>
</body>
</html>
