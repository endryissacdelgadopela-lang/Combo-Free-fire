<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sensibilidad - Free Fire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        h1 {
            text-align: center;
            color: #00f0ff;
            margin-bottom: 25px;
        }
        .bloque {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b8f2ff;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: white;
            font-size: 15px;
        }
        .opcion-fila {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .opcion {
            flex: 1;
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .opcion.activo {
            background: #00f0ff;
            color: #000;
            font-weight: bold;
        }
        .resultado {
            margin-top: 25px;
            padding: 18px;
            background: rgba(0,240,255,0.1);
            border-radius: 10px;
            border-left: 4px solid #00f0ff;
        }
        .valor-sens {
            font-size: 22px;
            font-weight: bold;
            color: #00ff9d;
            margin-top: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #00f0ff;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background: #00d0e0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Sensibilidad Free Fire</h1>

    <div class="bloque">
        <label>Elige tu dispositivo</label>
        <select id="dispositivo">
            <option value="bajo">Gama Baja</option>
            <option value="medio" selected>Gama Media</option>
            <option value="alto">Gama Alta</option>
        </select>
    </div>

    <div class="bloque">
        <label>¿Usas DPI personalizado?</label>
        <div class="opcion-fila">
            <div class="opcion activo" id="dpiSi" onclick="seleccionarDPI('si')">✅ Con DPI</div>
            <div class="opcion" id="dpiNo" onclick="seleccionarDPI('no')">❌ Sin DPI</div>
        </div>
    </div>

    <div class="bloque" id="campoDPI">
        <label>Valor de DPI</label>
        <input type="number" id="valorDPI" placeholder="Ej: 450" value="450">
    </div>

    <div class="bloque">
        <label>Botón de disparo</label>
        <div class="opcion-fila">
            <div class="opcion activo" id="botonSi" onclick="seleccionarBoton('si')">✅ Botón Grande</div>
            <div class="opcion" id="botonNo" onclick="seleccionarBoton('no')">❌ Botón Pequeño</div>
        </div>
    </div>

    <button onclick="calcularSensibilidad()">Calcular Sensibilidad</button>

    <div class="resultado">
        <h3>Tu sensibilidad recomendada:</h3>
        <div class="valor-sens" id="resultadoSens">Esperando datos...</div>
    </div>
</div>

<script src="sens.js"></script>
</body>
</html>
