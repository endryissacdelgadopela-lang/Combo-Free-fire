<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Sensi Pro Panel V9 - 9° Aniversario</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: radial-gradient(circle at 50% 0%, #1a052e 0%, #070312 70%, #010005 100%);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        /* --- ENCABEZADO DE NIVEL GLOBAL --- */
        .header-main {
            margin: 20px auto 30px auto;
            max-width: 480px;
        }
        .badge-9th {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 64px;
            background: linear-gradient(135deg, #00f0ff 0%, #ff007c 45%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 20px rgba(255, 0, 124, 0.6));
            letter-spacing: -2px;
        }
        .title-sub {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }
        
        /* Indicador de Estado Pro */
        .status-bar {
            display: inline-block;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid #00ffaa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffaa;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }
        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #00ffaa;
            border-radius: 50%;
            margin-right: 6px;
            animation: parpadeo 1.2s infinite;
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; filter: drop-shadow(0 0 4px #00ffaa); }
        }

        /* ==========================================
           PANEL DE AJUSTES SENSI PROFESIONAL (ABRE DIRECTO)
        ========================================== */
        #pantalla-sensi {
            max-width: 460px;
            margin: 0 auto;
        }
        .panel-container {
            background: linear-gradient(135deg, rgba(20, 10, 38, 0.85) 0%, rgba(7, 3, 15, 0.96) 100%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        }
        .opcion-grupo {
            text-align: left;
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #00f0ff;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        select {
            width: 100%;
            background: #05020a;
            border: 1px solid #32164d;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            transition: border 0.3s;
        }
        select:focus { border-color: #ff007c; }

        /* Malla Táctil de Modos */
        .modos-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-modo {
            background: #080412;
            border: 1px solid #281240;
            color: #9d8ebf;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-modo.active {
            background: linear-gradient(135deg, #ff007c 0%, #6200ff 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 0 15px rgba(255, 0, 124, 0.5);
            transform: translateY(-1px);
        }

        /* BOTÓN PRINCIPAL */
        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #ff007c);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 5px 20px rgba(255, 0, 124, 0.4);
            margin-top: 5px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* ==========================================
           VENTANAS FLOTANTES INTERACTIVAS (MODALS)
        ========================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 1, 8, 0.93);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: #06030d;
            border: 1px solid #3a1359;
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
        }
        
        /* Visor de Sensi Avanzado */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .card-sens {
            background: #0d071a;
            border: 1px solid #1f1033;
            border-radius: 14px;
            padding: 12px 8px;
            position: relative;
            text-align: center;
        }
        .card-label {
            color: #9d8ebf;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }
        .card-value {
            color: #00f0ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .card-sens-full {
            grid-column: span 2;
            background: linear-gradient(135deg, #160a29 0%, #0d071a 100%);
            border-color: rgba(255, 0, 124, 0.3);
        }
        .card-sens-full .card-value {
            color: #ffaa00;
            font-size: 22px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.3);
        }

        .btn-close {
            width: 100%;
            background: #110621;
            color: #ffffff;
            border: 1px solid #3c165c;
            padding: 13px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- LOGOTIPO Y BARRA DE ESTADO -->
    <div class="header-main">
        <div class="badge-9th">9th</div>
        <div class="title-sub">Sensi Profesional</div>
        <div class="status-bar"><span class="dot"></span>Sensi Inyectable Activa</div>
    </div>

    <!-- PANEL PRINCIPAL DE PARAMETROS (CARGA DIRECTA) -->
    <div id="pantalla-sensi">
        <div class="panel-container">
            <div class="opcion-grupo">
                <label>Tipo de Dispositivo:</label>
                <select id="selectDispositivo">
                    <option value="android">Android (Gama Baja / Media / Alta)</option>
                    <option value="ios">iOS (iPhone / iPad)</option>
                    <option value="emulador">PC (Emulador BlueStacks / MSI)</option>
                </select>
            </div>

            <div class="opcion-grupo">
                <label>Especialización de Armas:</label>
                <select id="selectArma">
                    <option value="todas">🎯 Todas las Armas (General)</option>
                    <option value="smg">🔫 Armas Cortas / SMG (Cercano)</option>
                    <option value="escopeta">💥 Escopetas / Un Tiro (Perfecto)</option>
                </select>
            </div>

            <div class="opcion-grupo">
                <label>Regulador de DPI:</label>
                <select id="selectDpi">
                    <option value="si">Activo (Ver Parámetro Recomendado)</option>
                    <option value="no">No DPI (Dejar de fábrica)</option>
                </select>
            </div>

            <div class="opcion-grupo">
                <label>Modo de Algoritmo Disparo:</label>
                <div class="modos-stack">
                    <button id="btn-alta" class="btn-modo active" onclick="cambiarModo('alta')">⚡ Alta Sensibilidad (Full Rojo)</button>
                    <button id="btn-precision" class="btn-modo" onclick="cambiarModo('precision')">🎯 Alta Precisión (Cero Temblequeo)</button>
                    <button id="btn-baja" class="btn-modo" onclick="cambiarModo('baja')">📉 Sensibilidad Baja (Control Estable)</button>
                </div>
            </div>

            <button class="btn-action" onclick="generarConfig()">Calcular Macro Sensi</button>
        </div>
    </div>

    <!-- PANTALLA PREMIUM DE AJUSTES FINALES -->
    <div id="resultadoModal" class="modal">
        <div class="modal-content">
            <div style="font-family:'Orbitron', sans-serif; font-size:16px; font-weight:700; border-bottom:2px solid #ff007c; padding-bottom:10px; margin-bottom:15px;" id="txtModoTitulo">REGISTRO DE INYECCIÓN</div>
            
            <div class="grid-cards">
                <div class="card-sens"><span class="card-label">General</span><span id="vGen" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira 1X</span><span id="vMira1" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira X2</span><span id="vMira2" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Mira X4</span><span id="vMira4" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Franco</span><span id="vFranco" class="card-value">0%</span></div>
                <div class="card-sens"><span class="card-label">Cámara</span><span id="vCamara" class="card-value">0%</span></div>
                
                <!-- Tarjeta Dinámica de DPI -->
                <div class="card-sens card-sens-full" id="cardDpi"><span class="card-label" style="color:#ffaa00;">DPI Recomendado</span><span id="vDpi" class="card-value">0</span></div>
                
                <!-- Tarjeta de Botón -->
                <div class="card-sens card-sens-full" style="border-color: #00f0ff;"><span class="card-label" style="color:#00f0ff;">Botón de Disparo Ideal</span><span id="vBoton" class="card-value">0%</span></div>
            </div>

            <button class="btn-close" onclick="cerrarModal()">Guardar en el Juego</button>
        </div>
    </div>

    <script src="sens.js"></script>
</body>
    </html>
