<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador FF - Endry + Dola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        on: '#FFD700',
                        off: '#27272a',
                        bg: '#09090b',
                        card: '#18181b'
                    }
                }
            }
        }
    </script>
    <style>
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            background: #FFD700; border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 10px #FFD700;
        }
        .slider { -webkit-appearance: none; height: 8px; background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="bg-bg text-white min-h-screen">

    <!-- Crédito permanente -->
    <div class="w-full bg-on text-black py-2 text-center font-bold text-sm sticky top-0 z-50">
        Freestyle Credit: Endry + Dola 🎮
    </div>

    <div class="container mx-auto px-4 py-6 max-w-lg">
        <h1 class="text-2xl font-black text-center text-on mb-6">🎯 SENSIBILIDAD FF</h1>

        <!-- Pestañas -->
        <div class="flex gap-2 mb-6">
            <button id="tabS" class="flex-1 py-3 rounded-lg font-bold bg-on text-black" onclick="irA(1)">
                <i class="fa-solid fa-crosshairs mr-1"></i> SENSIBILIDAD
            </button>
            <button id="tabF" class="flex-1 py-3 rounded-lg font-bold bg-off" onclick="irA(2)">
                <i class="fa-solid fa-bolt mr-1"></i> FF PROXY
            </button>
        </div>

        <!-- SECCIÓN SENSIBILIDAD -->
        <div id="s1" class="space-y-4">
            <div class="bg-card p-4 rounded-xl">
                <label class="font-bold block mb-2">Elige tu dispositivo</label>
                <select class="w-full bg-bg border border-zinc-600 rounded-lg p-3">
                    <option>iPhone / iPad</option>
                    <option>Android Gama Alta</option>
                    <option>Samsung / Xiaomi</option>
                </select>
            </div>

            <div class="bg-card p-4 rounded-xl space-y-4">
                <h3 class="font-bold text-lg text-on">🔥 Sensibilidad Todo Rojo</h3>

                <div>
                    <div class="flex justify-between mb-1"><span>Punto Rojo</span><span id="v1" class="text-on font-bold">100</span></div>
                    <input type="range" min="0" max="100" value="100" class="slider w-full" oninput="actVal(1)">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><span>Mira x2</span><span id="v2" class="text-on font-bold">98</span></div>
                    <input type="range" min="0" max="100" value="98" class="slider w-full" oninput="actVal(2)">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><span>Mira x4</span><span id="v3" class="text-on font-bold">95</span></div>
                    <input type="range" min="0" max="100" value="95" class="slider w-full" oninput="actVal(3)">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><span>Francotirador</span><span id="v4" class="text-on font-bold">92</span></div>
                    <input type="range" min="0" max="100" value="92" class="slider w-full" oninput="actVal(4)">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><span>Cámara 360</span><span id="v5" class="text-on font-bold">100</span></div>
                    <input type="range" min="0" max="100" value="100" class="slider w-full" oninput="actVal(5)">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="d1" class="py-3 rounded-lg font-bold bg-on text-black" onclick="selDpi(true)">✅ Con DPI</button>
                <button id="d2" class="py-3 rounded-lg font-bold bg-off" onclick="selDpi(false)">❌ Sin DPI</button>
            </div>

            <button class="w-full bg-on text-black py-4 rounded-xl font-bold text-lg" onclick="copiar()">
                <i class="fa-solid fa-copy mr-2"></i> COPIAR AJUSTES
            </button>
        </div>

        <!-- SECCIÓN FF PROXY -->
        <div id="s2" class="space-y-4 hidden">
            <div class="bg-card p-4 rounded-xl space-y-4">
                <h3 class="font-bold text-lg text-on">⚙️ Estabiliza Free Fire</h3>

                <div class="grid grid-cols-2 gap-3">
                    <button id="ff1" class="py-3 rounded-lg font-bold bg-on text-black" onclick="verFF('normal')">FF Normal</button>
                    <button id="ff2" class="py-3 rounded-lg font-bold bg-off" onclick="verFF('max')">FF MAX</button>
                </div>

                <div class="flex items-center justify-between p-3 bg-bg rounded-lg">
                    <span>Quitar llamadas y notificaciones</span>
                    <button id="sw1" class="w-12 h-6 bg-on rounded-full relative" onclick="toggle(1)">
                        <span class="absolute right-1 top-1 w-4 h-4 bg-black rounded-full"></span>
                    </button>
                </div>
                <div class="flex items-center justify-between p-3 bg-bg rounded-lg">
                    <span>Aceleración GPU</span>
                    <button id="sw2" class="w-12 h-6 bg-on rounded-full relative" onclick="toggle(2)">
                        <span class="absolute right-1 top-1 w-4 h-4 bg-black rounded-full"></span>
                    </button>
                </div>
                <div class="flex items-center justify-between p-3 bg-bg rounded-lg">
                    <span>Modo Alto Rendimiento</span>
                    <button id="sw3" class="w-12 h-6 bg-off rounded-full relative" onclick="toggle(3)">
                        <span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full"></span>
                    </button>
                </div>
            </div>

            <button class="w-full bg-on text-black py-4 rounded-xl font-bold text-lg" onclick="aplicar()">
                <i class="fa-solid fa-check mr-2"></i> APLICAR Y ABRIR FF
            </button>
        </div>
    </div>

    <script src="sens.js"></script>
</body>
</html>
